server:
  port: ${PORT:8080}

spring:
  application:
    name: docutrack-backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: prod
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:}
  admin:
    access-token-ttl: ${APP_ADMIN_TOKEN_TTL:8h}
  upload:
    dir: ${APP_UPLOAD_DIR:uploads/documents}
  notifications:
    expiry-cron: ${APP_NOTIFICATIONS_EXPIRY_CRON:0 0 9 * * *}
    whats-app:
      enabled: ${APP_WHATSAPP_ENABLED:false}
      api-base-url: ${APP_WHATSAPP_API_BASE_URL:https://graph.facebook.com/v21.0}
      access-token: ${APP_WHATSAPP_ACCESS_TOKEN:}
      phone-number-id: ${APP_WHATSAPP_PHONE_NUMBER_ID:}
      business-number: ${APP_WHATSAPP_BUSINESS_NUMBER:+918851613806}
  version:
    android:
      min-build: ${APP_ANDROID_MIN_BUILD:1}
      latest-build: ${APP_ANDROID_LATEST_BUILD:9}
      min-version: ${APP_ANDROID_MIN_VERSION:1.0.0}
      latest-version: ${APP_ANDROID_LATEST_VERSION:1.0.0}
      force-update: ${APP_ANDROID_FORCE_UPDATE:false}
      soft-update: ${APP_ANDROID_SOFT_UPDATE:true}
      title: ${APP_ANDROID_UPDATE_TITLE:Update available}
      message: ${APP_ANDROID_UPDATE_MESSAGE:A new version of ExpiryX is available.}
      store-url: ${APP_ANDROID_STORE_URL:https://play.google.com/store/apps/details?id=com.example.expiryx}
      release-notes: ${APP_ANDROID_RELEASE_NOTES:}
    ios:
      min-build: ${APP_IOS_MIN_BUILD:1}
      latest-build: ${APP_IOS_LATEST_BUILD:9}
      min-version: ${APP_IOS_MIN_VERSION:1.0.0}
      latest-version: ${APP_IOS_LATEST_VERSION:1.0.0}
      force-update: ${APP_IOS_FORCE_UPDATE:false}
      soft-update: ${APP_IOS_SOFT_UPDATE:true}
      title: ${APP_IOS_UPDATE_TITLE:Update available}
      message: ${APP_IOS_UPDATE_MESSAGE:A new version of ExpiryX is available.}
      store-url: ${APP_IOS_STORE_URL:https://apps.apple.com/app/id000000000}
      release-notes: ${APP_IOS_RELEASE_NOTES:}
    web:
      min-build: ${APP_WEB_MIN_BUILD:1}
      latest-build: ${APP_WEB_LATEST_BUILD:9}
      min-version: ${APP_WEB_MIN_VERSION:1.0.0}
      latest-version: ${APP_WEB_LATEST_VERSION:1.0.0}
      force-update: ${APP_WEB_FORCE_UPDATE:false}
      soft-update: ${APP_WEB_SOFT_UPDATE:true}
      title: ${APP_WEB_UPDATE_TITLE:Update available}
      message: ${APP_WEB_UPDATE_MESSAGE:A new version of ExpiryX is available.}
      store-url: ${APP_WEB_STORE_URL:https://expiryx.example.com}
      release-notes: ${APP_WEB_RELEASE_NOTES:}

logging:
  level:
    org.hibernate.SQL: debug

springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**
  swagger-ui:
    persist-authorization: true

