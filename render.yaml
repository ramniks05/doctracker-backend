services:
  - type: web
    name: doctracker-backend
    runtime: docker
    plan: free
    healthCheckPath: /v3/api-docs
    envVars:
      - fromGroup: doctracker
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: APP_WHATSAPP_ENABLED
        value: "false"
      - key: APP_UPLOAD_DIR
        value: /var/data
      - key: APP_PUBLIC_BASE_URL
        value: https://doctracker-backend.onrender.com
      # ExpiryX force-update (change on Render dashboard after store release; no SQL)
      - key: APP_ANDROID_MIN_BUILD
        value: "1"
      - key: APP_ANDROID_LATEST_BUILD
        value: "9"
      - key: APP_ANDROID_FORCE_UPDATE
        value: "false"
      - key: APP_ANDROID_STORE_URL
        value: https://play.google.com/store/apps/details?id=com.example.expiryx
